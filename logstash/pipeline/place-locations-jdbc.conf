input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/vendor/jar/jdbc/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"

    jdbc_connection_string => "${JDBC_CONNECTION_STRING}"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"
    clean_run => true
    schedule => "*/5 * * * *"

    statement => "
      SELECT
        l.id            AS location_id,
        l.place_id      AS place_id,
        p.name          AS name,
        p.description   AS description,
        p.category_id   AS category_id,
        l.district_id   AS district_id,
        l.address       AS address,
        l.lat           AS lat,
        l.lng           AS lng,
        p.updated_at    AS updated_at
      FROM locations l
      JOIN places p ON p.id = l.place_id
      WHERE p.updated_at > :sql_last_value
      ORDER BY p.updated_at ASC
    "

    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"

    record_last_run => true
    last_run_metadata_path => "/usr/share/logstash/jdbc_last_run/place_locations.yml"

    jdbc_paging_enabled => true
    jdbc_page_size => 1000
  }
}

filter {
  mutate {
    convert => {
      "lat" => "float"
      "lng" => "float"
      "place_id" => "integer"
      "location_id" => "integer"
      "category_id" => "integer"
      "district_id" => "integer"
    }
  }

  mutate {
    add_field => {
      "[geo][lat]" => "%{lat}"
      "[geo][lon]" => "%{lng}"
    }
  }

  mutate {
    convert => {
      "[geo][lat]" => "float"
      "[geo][lon]" => "float"
    }
  }

  # Làm data "đẹp" hơn trong Kibana (không hiện các field mặc định của Logstash)
  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "${ELASTICSEARCH_PLACE_LOCATIONS_INDEX}"
    document_id => "%{location_id}"
  }
}
