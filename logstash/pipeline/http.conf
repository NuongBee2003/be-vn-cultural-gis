input {
  http {
    port => 8081
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "service" => "be-vn-cultural-gis"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    index => "logstash-%{+YYYY.MM.dd}"
    ssl_verification_mode => "none"
  }
  stdout {
    codec => rubydebug
  }
}
